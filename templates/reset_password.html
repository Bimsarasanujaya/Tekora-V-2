<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reset Password — Tekora</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="authMarketing"><div class="softGrid"></div><a class="brand clean authBrand" href="{{url_for('home')}}"><div class="logo">T</div><b>Tekora</b></a><form class="authCard reveal" method="post"><h1>Create new password</h1>{% if valid %}<p>Enter a new password for your Tekora account.</p><label>New password</label><input name="password" type="password" autocomplete="new-password" required><label>Confirm new password</label><input name="confirm" type="password" autocomplete="new-password" required><button class="purpleBtn full">Reset password</button>{% else %}<p>This reset link cannot be used anymore. Request a new link.</p><a class="purpleBtn full" href="{{url_for('forgot_password')}}">Request new link</a>{% endif %}<small>{{msg}}</small><p class="switchText"><a href="{{url_for('login')}}">Back to login</a></p></form></body></html>
