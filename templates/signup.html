<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign Up — Tekora</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="authMarketing"><div class="softGrid"></div><a class="brand clean authBrand" href="{{url_for('home')}}"><div class="logo">T</div><b>Tekora</b></a><form class="authCard signupCard reveal" method="post"><h1>Create your account</h1><p>Sign up with email/password. Your subscription will be saved under this email.</p><a class="whiteBtn full oauthBtn" href="{{url_for('google_login')}}">G&nbsp; Sign up with Google</a><div class="divider"><span>OR WITH EMAIL</span></div><div class="twoCols"><div><label>First name</label><input name="first_name" autocomplete="given-name"></div><div><label>Last name</label><input name="last_name" autocomplete="family-name"></div></div><label>Email</label><input name="username" type="email" placeholder="name@example.com" autocomplete="email" required><label>Password</label><input name="password" type="password" minlength="8" autocomplete="new-password" required><label>Confirm password</label><input name="confirm" type="password" minlength="8" autocomplete="new-password" required><label class="agree"><input type="checkbox" required> I agree to the <a href="#">terms and conditions</a></label><button class="purpleBtn full">Create Account</button><small>{{msg}}</small><p class="switchText">Already have an account? <a href="{{url_for('login')}}">Log in</a></p></form></body></html>
